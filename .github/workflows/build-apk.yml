name: Build Hybrid V4 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract corrected Android project
        run: |
          set -e
          mkdir -p extracted
          unzip -o Hybrid_V4_Android_Project_Fixed_v2.zip -d extracted

          cp extracted/settings.gradle .
          cp extracted/build.gradle .
          cp extracted/gradle.properties .

          rm -rf app
          cp -r extracted/app .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-v4-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
